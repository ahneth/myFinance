<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252168" />
      <stop offset="55%" stop-color="#171542" />
      <stop offset="100%" stop-color="#0d0d26" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="goldArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
  </defs>

  <!-- Rounded Square Badge -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#6366f1" stroke-opacity="0.28" stroke-width="3" />

  <!-- Golden Coin Arc -->
  <path d="M 155 316 A 145 145 0 0 1 285 110" fill="none" stroke="url(#goldArc)" stroke-width="18" stroke-linecap="round" />
  <path d="M 168 308 A 128 128 0 0 1 280 127" fill="none" stroke="url(#goldArc)" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.85" />

  <!-- Three Ascending Wealth Bars -->
  <rect x="172" y="220" width="46" height="106" rx="8" fill="url(#bar1Grad)" />
  <rect x="236" y="168" width="46" height="158" rx="8" fill="url(#bar2Grad)" />
  <rect x="300" y="114" width="46" height="212" rx="8" fill="url(#bar3Grad)" />

  <!-- Dynamic Sweeping Growth Arrow -->
  <path d="M 140 332 C 215 330, 290 272, 372 172" fill="none" stroke="#0d0d26" stroke-width="32" stroke-linecap="round" />
  <path d="M 140 332 C 215 330, 290 272, 372 172" fill="none" stroke="url(#arrowGrad)" stroke-width="22" stroke-linecap="round" />
  <polygon points="416,136 346,154 396,204" fill="url(#arrowGrad)" />

  <!-- Wordmark Label -->
  <text x="256" y="422" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="68" letter-spacing="-1.5">
    <tspan fill="#67e8f9">my</tspan><tspan fill="#ffffff">Finance</tspan>
  </text>
</svg>